<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>動画ぼかし範囲指定</title>
<style>
    body{
        font-family:Arial,sans-serif;
        margin:20px;
        background:#f2f2f2;
    }

    h1{
        margin-bottom:15px;
    }

    #videoArea{
        position:relative;
        display:block;
        background:#000;
        width:fit-content;
        max-width:850px;
        margin-top:10px;
    }

    #video{
        display:block;
        max-width:850px;
        max-height:600px;
    }

    #canvas{
        position:absolute;
        left:0;
        top:0;
        cursor:crosshair;
    }

    button,
    input,
    select{
        margin:4px;
        padding:7px;
    }

    button.selected{
        background:#2563eb;
        color:white;
    }

    #rangeButtons{
        background:white;
        padding:10px;
        margin-top:10px;
        max-width:850px;
    }

    #previewBox{
        background:white;
        padding:12px;
        margin-top:10px;
        max-width:850px;
    }

    #previewCanvas{
        display:block;
        max-width:100%;
        background:#000;
    }

    #settings{
        background:white;
        padding:12px;
        margin-top:10px;
        max-width:850px;
    }

    .setting{
        display:inline-block;
        margin:5px 15px 5px 0;
    }

    .setting label{
        display:block;
        font-size:13px;
    }

    .setting input{
        width:90px;
    }

    #status{
        background:white;
        padding:12px;
        margin-top:10px;
        max-width:850px;
    }

    #progressBox{
        margin-top:10px;
        max-width:850px;
        background:white;
        padding:12px;
    }

    #seekBar {
      width: 500px;
      max-width: 100%;
  }
</style>
</head>


<body>
<h1>動画のぼかし範囲指定</h1>

<input type="file" id="file" accept="video/*">
<br>

<div id="videoArea">
  <video id="video" preload="metadata"></video>
  <canvas id="canvas"></canvas>
</div>

<div>
    <label for="seekBar">参照位置：</label>
    <input type="range" id="seekBar" min="0" max="1" step="0.01" value="0" disabled>
    <span id="seekTime">0.00秒</span>
    <button id="selectFrameButton">このフレームを参照</button>
</div>

<div id="rangeButtons">
  <button id="excludeButton" class="selected">除外範囲を追加</button>
  <button id="forceButton">強制ぼかし範囲を追加</button>
</div>

<div id="previewBox">
  <h3>プレビュー（白色検出＋強制ぼかし範囲）</h3>

  <label>
    <input type="checkbox" id="showMask">
    マスクを表示
  </label>

  <canvas id="previewCanvas"></canvas>
</div>

<div id="settings">
  <h3>ぼかし設定</h3>

  <div class="setting">
    <label>白色の下限</label>
    <input id="whiteMin" type="number" min="0" max="255">
  </div>

  <div class="setting">
    <label>白色の上限</label>
    <input id="whiteMax" type="number" min="0" max="255">
  </div>

  <div class="setting">
    <label>色差</label>
    <input id="colorDiff" type="number" min="0" max="255">
  </div>

  <div class="setting">
    <label>メディアンサイズ</label>
    <input id="medianSize" type="number" min="3" max="51" step="2">
  </div>

  <div class="setting">
    <label>マスク拡張</label>
    <input id="maskDilate" type="number" min="1" max="100">
  </div>

  <br>

  <button id="resetSettings">設定を初期値に戻す</button>
  <button id="previewButton">プレビュー更新</button>
</div>

<div id="status"></div>

<div>
  <button id="processButton">処理開始</button>
</div>

<div id="progressBox" style="display:none">
  <div style="background:#ddd;height:24px;border-radius:4px;overflow:hidden">
    <div id="progressBar"
         style="height:100%;width:0%;background:#2563eb;text-align:center;color:white;line-height:24px">
      0%
    </div>
  </div>
</div>


<script>
const fileInput = document.getElementById("file");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const previewCanvas = document.getElementById("previewCanvas");
const pctx = previewCanvas.getContext("2d");
const showMask = document.getElementById("showMask");

const statusBox = document.getElementById("status");

const seekBar = document.getElementById("seekBar");
const seekTime = document.getElementById("seekTime");
const selectFrameButton = document.getElementById("selectFrameButton");


// ============================================================
// 設定
// ============================================================

const defaults = {
    whiteMin: 100,
    whiteMax: 230,
    colorDiff: 35,
    medianSize: 9,
    maskDilate: 6
};

const ids = Object.keys(defaults);

function settings() {
    const s = {};

    for (const id of ids) {
        let n = Number(document.getElementById(id).value);

        if (!Number.isFinite(n)) {
            n = defaults[id];
        }

        if (id === "medianSize") {
            n = Math.max(3, Math.min(51, Math.round(n)));

            if (n % 2 === 0) {
                n++;
            }
        }

        s[id] = n;
    }

    return s;
}


function resetSettings() {
    for (const id of ids) {
        document.getElementById(id).value = defaults[id];
    }
}

resetSettings();

document.getElementById("resetSettings").onclick = resetSettings;


// ============================================================
// 動画読み込み
// ============================================================

video.addEventListener("loadedmetadata", () => {
    resizeCanvas();

    if (
        Number.isFinite(video.duration) &&
        video.duration > 0
    ) {
        seekBar.min = 0;
        seekBar.max = video.duration;
        seekBar.step = 0.01;
        seekBar.value = 0;

        seekTime.textContent = "0.00秒";

        seekBar.disabled = false;
    }
});


fileInput.onchange = () => {
    const f = fileInput.files[0];

    if (!f) {
        return;
    }

    video.src = URL.createObjectURL(f);
    video.load();

    ranges = [];
};


video.onloadeddata = () => {
    resizeCanvas();

    video.currentTime = 0;

    video.onseeked = () => {
        drawPreview();

        video.onseeked = null;
    };
};


window.onresize = resizeCanvas;


// ============================================================
// シークバー
// ============================================================

let seeking = false;

seekBar.addEventListener("pointerdown", () => {
    seeking = true;
});

seekBar.addEventListener("input", () => {
    const time = Number(seekBar.value);

    seekTime.textContent =
        `${time.toFixed(2)}秒`;

    video.currentTime = time;
});

seekBar.addEventListener("pointerup", () => {
    seeking = false;
});


selectFrameButton.addEventListener("click", () => {
    const time = Number(seekBar.value);

    video.currentTime = time;

    const seekedHandler = () => {
        drawPreview();

        video.removeEventListener(
            "seeked",
            seekedHandler
        );
    };

    video.addEventListener(
        "seeked",
        seekedHandler
    );
});


// ============================================================
// 範囲
// ============================================================

let mode = "exclude";
let ranges = [];
let dragging = false;
let startX = 0;
let startY = 0;
let currentRect = null;


function resizeCanvas() {
    if (!video.videoWidth) {
        return;
    }

    const r = video.getBoundingClientRect();

    canvas.width = Math.round(r.width);
    canvas.height = Math.round(r.height);

    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";

    drawRanges();
}


function normalize(x1, y1, x2, y2) {
    return {
        x: Math.min(x1, x2),
        y: Math.min(y1, y2),
        w: Math.abs(x2 - x1),
        h: Math.abs(y2 - y1)
    };
}


function pointerPos(e) {
    const r = canvas.getBoundingClientRect();

    return {
        x: e.clientX - r.left,
        y: e.clientY - r.top
    };
}


function hitTestRange(p) {
    const sx =
        canvas.width / video.videoWidth;

    const sy =
        canvas.height / video.videoHeight;

    for (let i = ranges.length - 1; i >= 0; i--) {
        const a = ranges[i];

        const x = a.x * sx;
        const y = a.y * sy;
        const w = a.w * sx;
        const h = a.h * sy;

        if (
            p.x >= x &&
            p.x <= x + w &&
            p.y >= y &&
            p.y <= y + h
        ) {
            return i;
        }
    }

    return -1;
}


canvas.onmousedown = e => {
    if (!video.videoWidth) {
        return;
    }

    const p = pointerPos(e);

    const hit = hitTestRange(p);

    if (hit >= 0) {
        ranges.splice(hit, 1);

        drawRanges();
        drawPreview();

        statusBox.textContent =
            "クリックした枠を削除しました。";

        return;
    }

    startX = p.x;
    startY = p.y;

    dragging = true;
    currentRect = null;
};


canvas.onmousemove = e => {
    if (!dragging) {
        return;
    }

    const p = pointerPos(e);

    currentRect =
        normalize(
            startX,
            startY,
            p.x,
            p.y
        );

    drawRanges();
};


canvas.onmouseup = () => {
    if (!dragging || !currentRect) {
        dragging = false;
        return;
    }

    dragging = false;

    if (
        currentRect.w < 5 ||
        currentRect.h < 5
    ) {
        currentRect = null;
        drawRanges();

        return;
    }

    const sx =
        video.videoWidth / canvas.width;

    const sy =
        video.videoHeight / canvas.height;

    ranges.push({
        type: mode,
        x: Math.round(currentRect.x * sx),
        y: Math.round(currentRect.y * sy),
        w: Math.round(currentRect.w * sx),
        h: Math.round(currentRect.h * sy)
    });

    currentRect = null;

    drawRanges();
    drawPreview();
};


canvas.onmouseleave = () => {
    dragging = false;
    currentRect = null;

    drawRanges();
};


function drawRanges() {
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if (!video.videoWidth) {
        return;
    }

    const sx =
        canvas.width / video.videoWidth;

    const sy =
        canvas.height / video.videoHeight;

    for (const a of ranges) {
        ctx.strokeStyle =
            a.type === "exclude"
                ? "#2563eb"
                : "#dc2626";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            a.x * sx,
            a.y * sy,
            a.w * sx,
            a.h * sy
        );
    }

    if (currentRect) {
        ctx.strokeStyle =
            mode === "exclude"
                ? "#2563eb"
                : "#dc2626";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            currentRect.x,
            currentRect.y,
            currentRect.w,
            currentRect.h
        );
    }
}


document.getElementById(
    "excludeButton"
).onclick = () => {
    mode = "exclude";

    excludeButton.classList.add("selected");
    forceButton.classList.remove("selected");
};


document.getElementById(
    "forceButton"
).onclick = () => {
    mode = "force";

    forceButton.classList.add("selected");
    excludeButton.classList.remove("selected");
};


// ============================================================
// プレビュー
// ============================================================

async function drawPreview() {
    if (!video.videoWidth) {
        return;
    }

    statusBox.textContent =
        "プレビューを作成しています。";

    const w = video.videoWidth;
    const h = video.videoHeight;

    const source = document.createElement("canvas");

    source.width = w;
    source.height = h;

    const sc = source.getContext("2d");

    sc.drawImage(
        video,
        0,
        0,
        w,
        h
    );

    const blob = await new Promise(resolve => {
        source.toBlob(
            resolve,
            "image/jpeg",
            0.95
        );
    });

    const fd = new FormData();

    fd.append(
        "image",
        blob,
        "preview.jpg"
    );

    fd.append(
        "ranges",
        JSON.stringify(ranges)
    );

    fd.append(
        "settings",
        JSON.stringify(settings())
    );

    try {
        const endpoint = showMask.checked
            ? "/preview_mask"
            : "/preview";

        const response = await fetch(
            endpoint,
            {
                method: "POST",
                body: fd
            }
        );

        if (!response.ok) {
            const j = await response.json();

            throw new Error(
                j.error || "プレビューに失敗しました"
            );
        }

        const previewBlob = await response.blob();

        const url = URL.createObjectURL(previewBlob);

        const img = new Image();

        img.onload = () => {
            previewCanvas.width = w;
            previewCanvas.height = h;

            pctx.clearRect(
                0,
                0,
                w,
                h
            );

            pctx.drawImage(
                img,
                0,
                0,
                w,
                h
            );

            URL.revokeObjectURL(url);

            statusBox.textContent =
                showMask.checked
                    ? "マスク画像を表示しました。"
                    : "現在のフレームにメディアン処理を適用しました。";
        };

        img.src = url;

    } catch (e) {
        statusBox.textContent =
            "プレビューエラー: " + e.message;
    }
}


// ============================================================
// 動画処理
// ============================================================

document.getElementById(
    "processButton"
).onclick = async () => {

    const f = fileInput.files[0];

    if (!f) {
        alert("動画を選択してください");
        return;
    }

    processButton.disabled = true;

    statusBox.textContent =
        "アップロード中です。";

    const progressBox =
        document.getElementById("progressBox");

    const progressBar =
        document.getElementById("progressBar");

    progressBox.style.display = "block";

    progressBar.style.width = "0%";
    progressBar.textContent = "0%";

    const fd = new FormData();

    fd.append("video", f);

    fd.append(
        "ranges",
        JSON.stringify(ranges)
    );

    fd.append(
        "settings",
        JSON.stringify(settings())
    );

    try {
        const r = await fetch(
            "/process",
            {
                method: "POST",
                body: fd
            }
        );

        const j = await r.json();

        if (!r.ok) {
            throw new Error(
                j.error ||
                "処理開始に失敗しました"
            );
        }

        const job = j.job;

        statusBox.textContent =
            "動画を処理しています。";

        while (true) {
            await new Promise(
                resolve =>
                    setTimeout(resolve, 500)
            );

            const pr = await fetch(
                "/progress/" + job
            );

            const pj = await pr.json();

            const value = pj.progress;

            if (value < 0) {
                throw new Error(
                    "動画処理中にエラーが発生しました"
                );
            }

            progressBar.style.width =
                value + "%";

            progressBar.textContent =
                value + "%";

            if (value >= 100) {
                break;
            }
        }

        statusBox.innerHTML =
            '処理完了：<a href="/download/' +
            job +
            '_clean.mp4" target="_blank">' +
            '完成動画を開く</a>';

    } catch (e) {
        statusBox.textContent =
            "エラー: " + e.message;
    }

    processButton.disabled = false;
};


document.getElementById(
    "previewButton"
).onclick = drawPreview;

showMask.addEventListener(
    "change",
    drawPreview
);


</script>
</body>
</html>
